
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local Port Availability Checker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .local-checker {
            max-width: 600px;
            margin: 40px auto;
            padding: 28px;
            background: white;
            color: #222;
            border-radius: 12px;
            box-shadow: 0 4px 16px #0001;
        }

        .local-checker input,
        .local-checker button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 7px;
            font-size: 16px;
        }

        .local-checker input {
            border: 1px solid #ccc;
        }

        .local-checker button {
            background: #176b4d;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .local-checker button:hover {
            background: #104f39;
        }

        .port-result {
            margin-top: 22px;
            padding: 16px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .FREE {
            background: #dcfce7;
            color: #166534;
        }

        .BUSY {
            background: #fee2e2;
            color: #991b1b;
        }

        .ERROR {
            background: #fef3c7;
            color: #92400e;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #176b4d;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .description {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <main class="local-checker">

        <h1>Local Port Checker</h1>

        <p class="description">
            Check whether a TCP port can be bound on your computer.
            Enter a port number between 1 and 65535.
        </p>

        <form method="POST"
              action="{{ url_for('local_port_check') }}">

            <label for="port">
                <strong>Port number (1–65535)</strong>
            </label>

            <input
                id="port"
                name="port"
                type="number"
                min="1"
                max="65535"
                step="1"
                required
                value="{{ port }}"
                placeholder="Enter port, e.g. 5000"
            >

            <button type="submit">Check Port Availability</button>

        </form>

        {% if error %}
        <section class="port-result ERROR" role="alert">
            <strong>Error</strong>
            <p>{{ error }}</p>
        </section>
        {% endif %}

        {% if result %}
        <section
            class="port-result {{ result.status }}"
            aria-live="polite"
        >
            <h2>Status: {{ result.status }}</h2>
            <p>{{ result.message }}</p>
        </section>
        {% endif %}

        <a class="back-link" href="{{ url_for('index') }}">
            ← Back to Port Checker
        </a>

    </main>

</body>
</html>
